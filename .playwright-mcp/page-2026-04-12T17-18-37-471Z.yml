            - text: "#"
        - list [ref=e385]:
          - listitem [ref=e386]:
            - strong [ref=e387]: Missing termination
            - text: — the most common cause of “bus works intermittently at low speed but fails at high speed.” Without terminators, reflections corrupt the signal.
          - listitem [ref=e388]:
            - strong [ref=e389]: Long stubs
            - text: — a node connected via a 1-meter cable to a backbone will cause reflections that are invisible at 125 kbit/s but fatal at 500 kbit/s.
          - listitem [ref=e390]:
            - strong [ref=e391]: Star wiring
            - text: — multiple equal-length branches with terminators at each end creates impedance mismatches and standing waves.
          - listitem [ref=e392]:
            - strong [ref=e393]: Ground-loop noise
            - text: — if nodes have separate, distant grounds, common-mode voltage between them can exceed the transceiver’s −2 V to +7 V window.
          - listitem [ref=e394]:
            - strong [ref=e395]: Swapped CANH / CANL
            - text: — communication fails silently; the differential is inverted, so the receiver interprets everything as recessive.
