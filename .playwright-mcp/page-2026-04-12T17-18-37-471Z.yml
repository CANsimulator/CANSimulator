        - heading "How the transceiver drives the busPermalink for this section" [level=3] [ref=e257]:
          - text: How the transceiver drives the bus
          - link "Permalink for this section" [ref=e258] [cursor=pointer]:
            - /url: "#how-the-transceiver-drives-the-bus"
            - text: "#"
        - list [ref=e259]:
          - listitem [ref=e260]:
            - strong [ref=e261]: MCU pulls TXD low
            - text: → transceiver drives CANH up (~3.5 V) and CANL down (~1.5 V) → bus goes
            - strong [ref=e262]: dominant
          - listitem [ref=e263]:
            - strong [ref=e264]: MCU releases TXD high
            - text: → transceiver tri-states its outputs → bus returns to
            - strong [ref=e265]: recessive
            - text: (both wires biased to ~2.5 V by the termination network)
          - listitem [ref=e266]: The transceiver simultaneously reads the bus via RXD, which is how the transmitting node can detect a collision during arbitration — if it sent a recessive bit but reads dominant, another node is asserting.
        - heading "Electrical fault protectionPermalink for this section" [level=3] [ref=e267]:
          - text: Electrical fault protection
          - link "Permalink for this section" [ref=e268] [cursor=pointer]:
            - /url: "#electrical-fault-protection"
            - text: "#"
        - paragraph [ref=e269]: "Modern transceivers protect against:"
        - list [ref=e270]:
          - listitem [ref=e271]:
            - strong [ref=e272]: Bus short to battery or ground
            - text: — clamping diodes limit voltage
          - listitem [ref=e273]:
            - strong [ref=e274]: Bus short between CANH and CANL
            - text: — communication degrades but the transceiver survives
          - listitem [ref=e275]:
            - strong [ref=e276]: ESD
            - text: — rated for ±8 kV HBM minimum on bus pins
          - listitem [ref=e277]:
            - strong [ref=e278]: Thermal shutdown
            - text: — if current exceeds safe limits from a shorted termination
        - heading "Signal integrityPermalink for this section" [level=2] [ref=e279]:
          - text: Signal integrity
          - link "Permalink for this section" [ref=e280] [cursor=pointer]:
            - /url: "#signal-integrity"
            - text: "#"
        - heading "Propagation delayPermalink for this section" [level=3] [ref=e281]:
          - text: Propagation delay
          - link "Permalink for this section" [ref=e282] [cursor=pointer]:
            - /url: "#propagation-delay"
            - text: "#"
        - paragraph [ref=e283]:
          - text: A CAN bit must be read by every node on the bus within the same bit time. As the bus gets longer, the propagation delay from end to end increases. ISO 11898-2 specifies a maximum of
          - strong [ref=e284]: 5 μs
          - text: "round-trip propagation, which directly constrains:"
        - list [ref=e285]:
          - listitem [ref=e286]:
            - strong [ref=e287]: Bus length
            - text: at a given bit rate
          - listitem [ref=e288]:
            - strong [ref=e289]: Bit timing parameters
            - text: (Prop_Seg compensates for propagation)
        - paragraph [ref=e290]: At 1 Mbit/s, each bit is only 1 μs. The round-trip propagation budget is tight, limiting the bus to ~40 m. At 125 kbit/s (8 μs per bit), hundreds of meters are practical.
        - heading "Bit rate vs maximum bus lengthPermalink for this section" [level=3] [ref=e291]:
          - text: Bit rate vs maximum bus length
          - link "Permalink for this section" [ref=e292] [cursor=pointer]:
            - /url: "#bit-rate-vs-maximum-bus-length"
            - text: "#"
        - table [ref=e293]:
          - rowgroup [ref=e294]:
            - row "Bit rate Nominal bit time Max recommended length" [ref=e295]:
              - columnheader "Bit rate" [ref=e296]
              - columnheader "Nominal bit time" [ref=e297]
              - columnheader "Max recommended length" [ref=e298]
          - rowgroup [ref=e299]:
            - row "1 Mbit/s 1 μs ~40 m" [ref=e300]:
              - cell "1 Mbit/s" [ref=e301]
              - cell "1 μs" [ref=e302]
              - cell "~40 m" [ref=e303]
            - row "500 kbit/s 2 μs ~100 m" [ref=e304]:
              - cell "500 kbit/s" [ref=e305]
              - cell "2 μs" [ref=e306]
              - cell "~100 m" [ref=e307]
            - row "250 kbit/s 4 μs ~250 m" [ref=e308]:
              - cell "250 kbit/s" [ref=e309]
              - cell "4 μs" [ref=e310]
              - cell "~250 m" [ref=e311]
            - row "125 kbit/s 8 μs ~500 m" [ref=e312]:
              - cell "125 kbit/s" [ref=e313]
              - cell "8 μs" [ref=e314]
              - cell "~500 m" [ref=e315]
            - row "50 kbit/s 20 μs ~1000 m" [ref=e316]:
              - cell "50 kbit/s" [ref=e317]
              - cell "20 μs" [ref=e318]
              - cell "~1000 m" [ref=e319]
        - paragraph [ref=e320]: These are conservative ISO-guideline values. Real-world ranges depend on cable quality, stub lengths, and transceiver loop delay.
        - heading "Common-mode rangePermalink for this section" [level=3] [ref=e321]:
          - text: Common-mode range
          - link "Permalink for this section" [ref=e322] [cursor=pointer]:
            - /url: "#common-mode-range"
            - text: "#"
        - paragraph [ref=e323]:
          - text: The differential receiver works as long as both CANH and CANL stay within the common-mode input range, specified as
          - strong [ref=e324]: −2 V to +7 V
          - text: for ISO 11898-2. Ground offsets between distant nodes (caused by cable resistance carrying return currents) are tolerated up to this range, which is why CAN works reliably in vehicles with long ground paths.
        - heading "Wiring recommendationsPermalink for this section" [level=2] [ref=e325]:
          - text: Wiring recommendations
          - link "Permalink for this section" [ref=e326] [cursor=pointer]:
            - /url: "#wiring-recommendations"
            - text: "#"
