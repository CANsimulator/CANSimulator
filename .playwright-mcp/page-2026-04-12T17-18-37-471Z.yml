      - main [ref=e69]:
        - heading "CAN Physical Layer" [level=1] [ref=e70]
        - paragraph [ref=e71]:
          - text: The CAN physical layer — standardized as
          - strong [ref=e72]: ISO 11898-2
          - text: (high-speed) and
          - strong [ref=e73]: ISO 11898-3
          - text: (low-speed, fault-tolerant) — defines how binary 1s and 0s become electrical signals on a pair of wires. Everything about CAN’s robustness in noisy environments traces back to the decisions made at this level.
        - heading "Differential signalingPermalink for this section" [level=2] [ref=e74]:
          - text: Differential signaling
          - link "Permalink for this section" [ref=e75] [cursor=pointer]:
            - /url: "#differential-signaling"
            - text: "#"
        - paragraph [ref=e76]:
          - text: CAN uses a
          - strong [ref=e77]: two-wire differential pair
          - text: ":"
          - strong [ref=e78]: CANH
          - text: (CAN High) and
          - strong [ref=e79]: CANL
          - text: (CAN Low). Instead of measuring a voltage against ground, the receiver measures the
          - emphasis [ref=e80]: difference
          - text: between CANH and CANL. Common-mode noise — EMI that shifts both wires equally — cancels out.
        - heading "Voltage levels (high-speed CAN)Permalink for this section" [level=3] [ref=e81]:
          - text: Voltage levels (high-speed CAN)
          - link "Permalink for this section" [ref=e82] [cursor=pointer]:
            - /url: "#voltage-levels-high-speed-can"
            - text: "#"
        - table [ref=e83]:
          - rowgroup [ref=e84]:
            - row "Bus state CANH CANL V_diff (CANH − CANL) Logic level" [ref=e85]:
              - columnheader "Bus state" [ref=e86]
              - columnheader "CANH" [ref=e87]
              - columnheader "CANL" [ref=e88]
              - columnheader "V_diff (CANH − CANL)" [ref=e89]
              - columnheader "Logic level" [ref=e90]
          - rowgroup [ref=e91]:
            - row "Recessive ≈ 2.5 V ≈ 2.5 V ≈ 0 V Logic 1" [ref=e92]:
              - cell "Recessive" [ref=e93]:
                - strong [ref=e94]: Recessive
              - cell "≈ 2.5 V" [ref=e95]
              - cell "≈ 2.5 V" [ref=e96]
              - cell "≈ 0 V" [ref=e97]
              - cell "Logic 1" [ref=e98]:
                - text: Logic
                - strong [ref=e99]: "1"
            - row "Dominant ≈ 3.5 V ≈ 1.5 V ≈ 2.0 V Logic 0" [ref=e100]:
              - cell "Dominant" [ref=e101]:
                - strong [ref=e102]: Dominant
              - cell "≈ 3.5 V" [ref=e103]
              - cell "≈ 1.5 V" [ref=e104]
              - cell "≈ 2.0 V" [ref=e105]
              - cell "Logic 0" [ref=e106]:
                - text: Logic
                - strong [ref=e107]: "0"
        - paragraph [ref=e108]: "A few things to note:"
        - list [ref=e109]:
          - listitem [ref=e110]:
            - strong [ref=e111]: Recessive means “floating.”
            - text: Both wires sit at 2.5 V through internal bias resistors. Nobody is actively driving the bus.
          - listitem [ref=e112]:
            - strong [ref=e113]: Dominant means “driven.”
            - text: The transmitting node pulls CANH up to ~3.5 V and CANL down to ~1.5 V, creating a 2.0 V differential.
          - listitem [ref=e114]:
            - strong [ref=e115]: Dominant always wins over recessive.
            - text: If one node drives dominant while another drives recessive on the same bit time, the bus reads dominant. This is the foundation of non-destructive arbitration.
        - blockquote [ref=e116]:
          - paragraph [ref=e117]:
            - strong [ref=e118]: Why these names?
            - text: "Think of it physically: dominant actively overrides the idle state, just as a dominant allele masks a recessive one. The naming comes from the genetics analogy Robert Bosch used in early CAN documentation."
        - heading "Receiver thresholdPermalink for this section" [level=3] [ref=e119]:
          - text: Receiver threshold
          - link "Permalink for this section" [ref=e120] [cursor=pointer]:
            - /url: "#receiver-threshold"
            - text: "#"
        - paragraph [ref=e121]: "An ISO 11898-2 compliant receiver interprets:"
        - list [ref=e122]:
          - listitem [ref=e123]:
            - strong [ref=e124]: V_diff > 0.9 V
            - text: → dominant (logic 0)
          - listitem [ref=e125]:
            - strong [ref=e126]: V_diff < 0.5 V
            - text: → recessive (logic 1)
          - listitem [ref=e127]:
            - strong [ref=e128]: 0.5 V ≤ V_diff ≤ 0.9 V
            - text: → undefined (hysteresis region)
        - paragraph [ref=e129]: The wide gap between 0.5 V and 0.9 V gives the receiver noise margin. On a well-terminated bus in a car, the dominant differential typically reads 1.5 V – 3.0 V, far above the threshold.
        - heading "Bus topologyPermalink for this section" [level=2] [ref=e130]:
          - text: Bus topology
          - link "Permalink for this section" [ref=e131] [cursor=pointer]:
            - /url: "#bus-topology"
            - text: "#"
        - paragraph [ref=e132]:
          - text: High-speed CAN uses a
          - strong [ref=e133]: linear bus
          - text: (also called “daisy chain” or “backbone”) — a single unshielded twisted pair runs the length of the network, and each node taps into it through a short
          - strong [ref=e134]: stub
          - text: .
        - generic [ref=e135]:
          - paragraph [ref=e136]: "Interactive: CAN bus topology — hover on any element"
          - img "CAN bus linear topology diagram" [ref=e137]:
            - generic [ref=e139] [cursor=pointer]: CANH backbone CANL
            - generic [ref=e140]:
              - generic [ref=e142] [cursor=pointer]: stub
              - generic [ref=e144] [cursor=pointer]:
