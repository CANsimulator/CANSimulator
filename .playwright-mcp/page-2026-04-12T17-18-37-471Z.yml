              - cell "External power (optional)" [ref=e371]
        - heading "Low-speed fault-tolerant CAN (ISO 11898-3)Permalink for this section" [level=2] [ref=e372]:
          - text: Low-speed fault-tolerant CAN (ISO 11898-3)
          - link "Permalink for this section" [ref=e373] [cursor=pointer]:
            - /url: "#low-speed-fault-tolerant-can-iso-11898-3"
            - text: "#"
        - paragraph [ref=e374]: "ISO 11898-3 is a separate physical layer that trades bandwidth for fault tolerance:"
        - list [ref=e375]:
          - listitem [ref=e376]:
            - text: "Max bit rate:"
            - strong [ref=e377]: 125 kbit/s
          - listitem [ref=e378]: Each transceiver has its own internal termination — no external 120 Ω resistors needed
          - listitem [ref=e379]:
            - text: Can detect and communicate through
            - strong [ref=e380]: single-wire faults
            - text: (one wire shorted to ground, open, or shorted to battery)
          - listitem [ref=e381]: "Voltage levels differ: CANH swings 0 V – 5 V, CANL swings 0 V – 5 V (not centered on 2.5 V)"
          - listitem [ref=e382]: Used for comfort / body electronics (mirrors, seats, windows) where the bus is not safety-critical at high speed
        - heading "Common pitfallsPermalink for this section" [level=2] [ref=e383]:
          - text: Common pitfalls
          - link "Permalink for this section" [ref=e384] [cursor=pointer]:
