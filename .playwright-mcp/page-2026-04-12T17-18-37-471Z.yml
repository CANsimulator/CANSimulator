              - generic [ref=e174] [cursor=pointer]:
                - generic [ref=e176]: Node D
                - generic [ref=e177]: MCU + XCVR
                - generic [ref=e178]: TX
                - generic [ref=e179]: RX
            - generic [ref=e183] [cursor=pointer]: 120 Ω
            - generic [ref=e187] [cursor=pointer]: 120 Ω
            - generic [ref=e188]: "Total DC load: 120 Ω ∥ 120 Ω = 60 Ω"
          - generic [ref=e189]:
            - generic [ref=e436]: Backbone (CANH + CANL)
            - paragraph [ref=e437]: "The backbone is a single unshielded twisted pair carrying two differential signals: CANH (high) and CANL (low). The twist rejects electromagnetic interference."
            - paragraph [ref=e438]: AWG 22–24, ~120 Ω characteristic impedance, 1–2 twists/inch
        - heading "Key topology rulesPermalink for this section" [level=3] [ref=e191]:
          - text: Key topology rules
          - link "Permalink for this section" [ref=e192] [cursor=pointer]:
            - /url: "#key-topology-rules"
            - text: "#"
        - list [ref=e193]:
          - listitem [ref=e194]:
            - strong [ref=e195]: Two 120 Ω terminators
            - text: — one at each physical end of the backbone. They absorb signal reflections that would distort the differential waveform.
          - listitem [ref=e196]:
            - strong [ref=e197]: Stubs must be short
            - text: — ideally under 30 cm at 500 kbit/s, shorter at 1 Mbit/s. Long stubs create signal reflections inside the stub that corrupt bus state.
          - listitem [ref=e198]:
            - strong [ref=e199]: Star topologies are discouraged
            - text: for high-speed CAN. A star creates multiple unterminated branches that reflect. Low-speed (fault-tolerant) CAN can tolerate stars because it runs slower.
          - listitem [ref=e200]:
            - strong [ref=e201]: Total bus length depends on bit rate
            - text: — at 1 Mbit/s, ISO recommends ≤ 40 m; at 125 kbit/s, up to 500 m is practical.
        - heading "Why 120 Ω?Permalink for this section" [level=3] [ref=e202]:
          - text: Why 120 Ω?
          - link "Permalink for this section" [ref=e203] [cursor=pointer]:
            - /url: "#why-120-ω"
            - text: "#"
        - paragraph [ref=e204]: The characteristic impedance of a typical CAN twisted pair (AWG 22 – 24, loosely twisted) is approximately 120 Ω. Matching the termination resistor to the cable impedance minimizes reflections. Two 120 Ω resistors in parallel gives the receiver a 60 Ω DC load on the differential pair, which the transceivers are designed to drive.
        - blockquote [ref=e205]:
          - paragraph [ref=e206]:
            - strong [ref=e207]: Troubleshooting tip.
            - text: Measure resistance between CANH and CANL with the bus powered off. You should read approximately
            - strong [ref=e208]: 60 Ω
            - text: (two 120 Ω in parallel). If you read 120 Ω, one terminator is missing. If you read 40 Ω, somebody added an extra one.
        - heading "TransceiverPermalink for this section" [level=2] [ref=e209]:
          - text: Transceiver
          - link "Permalink for this section" [ref=e210] [cursor=pointer]:
            - /url: "#transceiver"
            - text: "#"
        - paragraph [ref=e211]:
          - text: The
          - strong [ref=e212]: CAN transceiver
          - text: is the IC that converts between the ECU’s single-ended logic-level TX/RX pins and the differential bus. Common transceivers include the TJA1050/TJA1051 (NXP), MCP2551 (Microchip), and SN65HVD230 (TI).
        - heading "Transceiver pinout (typical)Permalink for this section" [level=3] [ref=e213]:
          - text: Transceiver pinout (typical)
          - link "Permalink for this section" [ref=e214] [cursor=pointer]:
            - /url: "#transceiver-pinout-typical"
            - text: "#"
        - table [ref=e215]:
          - rowgroup [ref=e216]:
            - row "Pin Direction Description" [ref=e217]:
              - columnheader "Pin" [ref=e218]
              - columnheader "Direction" [ref=e219]
