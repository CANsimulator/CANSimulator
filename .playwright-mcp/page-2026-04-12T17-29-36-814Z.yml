        - heading "SynchronizationPermalink for this section" [level=2] [ref=e235]:
          - text: Synchronization
          - link "Permalink for this section" [ref=e236] [cursor=pointer]:
            - /url: "#synchronization"
            - text: "#"
        - paragraph [ref=e237]: "CAN nodes synchronize to the bus signal in two ways:"
        - heading "Hard synchronizationPermalink for this section" [level=3] [ref=e238]:
          - text: Hard synchronization
          - link "Permalink for this section" [ref=e239] [cursor=pointer]:
            - /url: "#hard-synchronization"
            - text: "#"
        - paragraph [ref=e240]:
          - text: Occurs on the
          - strong [ref=e241]: SOF bit
          - text: (Start of Frame). Every receiver resets its bit-time counter so that the falling edge of SOF falls within Sync Seg. After hard sync, all subsequent bits in the frame use resynchronization only.
        - heading "ResynchronizationPermalink for this section" [level=3] [ref=e242]:
          - text: Resynchronization
          - link "Permalink for this section" [ref=e243] [cursor=pointer]:
            - /url: "#resynchronization"
            - text: "#"
        - paragraph [ref=e244]:
          - text: During the frame, edges that arrive
          - strong [ref=e245]: outside
          - text: "Sync Seg trigger a phase adjustment:"
        - list [ref=e246]:
          - listitem [ref=e247]:
            - text: If the edge arrives
            - strong [ref=e248]: before
            - text: the expected position (in TSEG1), the controller
            - strong [ref=e249]: shortens
            - text: the current bit by up to SJW time quanta.
          - listitem [ref=e250]:
            - text: If the edge arrives
            - strong [ref=e251]: after
            - text: the expected position (in TSEG2), the controller
            - strong [ref=e252]: lengthens
            - text: the current bit by up to SJW time quanta.
        - paragraph [ref=e253]:
          - text: This is why
          - strong [ref=e254]: SJW
          - text: "matters: a larger SJW tolerates more clock drift between nodes but introduces more jitter on the sample point. For most applications, SJW = 1 or 2 is sufficient."
        - heading "Bit stuffing and sync opportunitiesPermalink for this section" [level=3] [ref=e255]:
          - text: Bit stuffing and sync opportunities
          - link "Permalink for this section" [ref=e256] [cursor=pointer]:
            - /url: "#bit-stuffing-and-sync-opportunities"
            - text: "#"
        - paragraph [ref=e257]:
          - text: CAN uses
          - strong [ref=e258]: bit stuffing
          - text: ": after 5 consecutive identical bits, the transmitter inserts a complementary bit. Stuff bits guarantee transitions on the bus at least every 5 bits, which keeps the resynchronization mechanism fed with edges. Without bit stuffing, a long sequence of identical bits could cause receivers to drift out of lock."
        - heading "Oscillator tolerancePermalink for this section" [level=2] [ref=e259]:
          - text: Oscillator tolerance
          - link "Permalink for this section" [ref=e260] [cursor=pointer]:
            - /url: "#oscillator-tolerance"
            - text: "#"
        - paragraph [ref=e261]: "The maximum allowed clock-frequency deviation between any two nodes on the same bus is determined by:"
        - code [ref=e264]:
          - generic [ref=e265]: df_max ≤ min( SJW / (2 × 10 × total_Tq), SJW / (20 × total_Tq) )
        - paragraph [ref=e266]:
          - text: For a 16 Tq bit with SJW = 1, this gives
          - strong [ref=e267]: 0.3125%
          - text: — easily within the tolerance of a ceramic resonator but possibly tight for an RC oscillator. Crystal oscillators (±50 ppm) are always safe.
