      - main [ref=e111]:
        - heading "CAN Bit Timing" [level=1] [ref=e112]
        - paragraph [ref=e113]:
          - text: Every node on a CAN bus must agree on exactly when each bit begins and ends. Unlike SPI or I²C, CAN has
          - strong [ref=e114]: no dedicated clock wire
          - text: "— instead, each node derives bit boundaries from the bus signal itself using a configurable set of timing parameters. Getting these parameters right is essential: a mismatch of even a fraction of a percent can cause intermittent CRC errors under temperature drift."
        - heading "The time quantum (Tq)Permalink for this section" [level=2] [ref=e115]:
          - text: The time quantum (Tq)
          - link "Permalink for this section" [ref=e116] [cursor=pointer]:
            - /url: "#the-time-quantum-tq"
            - text: "#"
        - paragraph [ref=e117]:
          - text: The CAN controller’s oscillator clock is divided by the
          - strong [ref=e118]: Baud Rate Prescaler (BRP)
          - text: to produce a smaller unit called the
          - strong [ref=e119]: time quantum (Tq)
          - text: ":"
        - code [ref=e122]:
          - generic [ref=e123]: Tq = BRP / f_osc
        - paragraph [ref=e124]: For example, a 16 MHz oscillator with BRP = 2 yields Tq = 125 ns.
        - paragraph [ref=e125]: Every bit period is composed of a whole number of time quanta. By adjusting BRP and the segment lengths below, you control both the bit rate and the sample point.
        - heading "Anatomy of a single bitPermalink for this section" [level=2] [ref=e126]:
          - text: Anatomy of a single bit
          - link "Permalink for this section" [ref=e127] [cursor=pointer]:
            - /url: "#anatomy-of-a-single-bit"
            - text: "#"
        - paragraph [ref=e128]: "A CAN bit is divided into four logical segments, though most controllers merge the first two:"
        - generic [ref=e129]:
          - paragraph [ref=e130]: "Interactive: CAN bit anatomy — hover on any segment"
          - img "CAN bit time segment diagram" [ref=e131]:
            - generic [ref=e132] [cursor=pointer]:
              - generic [ref=e134]: Sync
              - generic [ref=e135]: 1 Tq
            - generic [ref=e136] [cursor=pointer]:
              - generic [ref=e138]: Prop Seg
              - generic [ref=e139]: Phase Seg 1
              - generic [ref=e140]: TSEG1
              - generic [ref=e141]: 13 Tq
            - generic [ref=e142] [cursor=pointer]:
              - generic [ref=e144]: TSEG2
              - generic [ref=e145]: 2 Tq
            - generic [ref=e146] [cursor=pointer]:
              - generic [ref=e149]: Sample Point
              - generic [ref=e150]: 87.5%
            - generic [ref=e152]: bit start
            - generic [ref=e155] [cursor=pointer]: ±SJW
            - generic [ref=e157]: 1 bit = 16 Tq
          - generic [ref=e158]:
            - generic [ref=e405]: TSEG1 (Prop Seg + Phase Seg 1)
            - paragraph [ref=e406]: Time Segment 1 compensates for propagation delay across the bus and provides a phase-error buffer before the sample point. Most CAN controllers combine the ISO-defined "Propagation Segment" and "Phase Segment 1" into a single TSEG1 register.
            - paragraph [ref=e407]: "Range: 1–256 Tq (controller-dependent). Longer buses need more Tq in TSEG1 to cover round-trip propagation delay + transceiver loop delay."
        - paragraph [ref=e160]:
          - strong [ref=e161]: Total bit time
          - text: = 1 + TSEG1 + TSEG2 time quanta.
        - paragraph [ref=e162]:
          - strong [ref=e163]: Bit rate
          - text: = f_osc / (BRP × (1 + TSEG1 + TSEG2)).
        - heading "Sample pointPermalink for this section" [level=2] [ref=e164]:
          - text: Sample point
          - link "Permalink for this section" [ref=e165] [cursor=pointer]:
            - /url: "#sample-point"
            - text: "#"
        - paragraph [ref=e166]:
          - text: The
          - strong [ref=e167]: sample point
          - text: "is where the controller reads the bus level and decides whether the bit is dominant or recessive. It falls at the boundary between TSEG1 and TSEG2:"
        - code [ref=e170]:
          - generic [ref=e171]: Sample Point (%) = (1 + TSEG1) / (1 + TSEG1 + TSEG2) × 100
        - heading "Recommended valuesPermalink for this section" [level=3] [ref=e172]:
          - text: Recommended values
          - link "Permalink for this section" [ref=e173] [cursor=pointer]:
            - /url: "#recommended-values"
            - text: "#"
