        - paragraph [ref=e203]:
          - text: A sample point that is
          - strong [ref=e204]: too early
          - text: makes the node vulnerable to propagation delay — it might read the bus before the remote transmitter’s bit has fully propagated. A sample point that is
          - strong [ref=e205]: too late
          - text: reduces the window for phase-error correction in TSEG2.
        - heading "Interactive calculatorPermalink for this section" [level=2] [ref=e206]:
          - text: Interactive calculator
          - link "Permalink for this section" [ref=e207] [cursor=pointer]:
            - /url: "#interactive-calculator"
            - text: "#"
        - paragraph [ref=e208]: Adjust BRP, TSEG1, and TSEG2 below. The yellow bar marks the sample point. Green text indicates the bit rate matches a standard CAN rate and the sample point falls in the recommended range.
