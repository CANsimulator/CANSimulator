        - heading "Common pitfallsPermalink for this section" [level=2] [ref=e355]:
          - text: Common pitfalls
          - link "Permalink for this section" [ref=e356] [cursor=pointer]:
            - /url: "#common-pitfalls"
            - text: "#"
        - list [ref=e357]:
          - listitem [ref=e358]:
            - strong [ref=e359]: Ignoring propagation delay.
            - text: Long buses (> 20 m at 500 kbit/s) need more time quanta in TSEG1 to accommodate the round-trip signal delay between the two furthest nodes plus transceiver loop delay.
          - listitem [ref=e360]:
            - strong [ref=e361]: Mismatched sample points.
            - text: Every node on the bus must use the same sample point percentage (within oscillator tolerance). If one node samples at 87.5% and another at 62.5%, intermittent bit errors will appear under high bus load.
          - listitem [ref=e362]:
            - strong [ref=e363]: SJW too large.
            - text: While SJW > 1 increases re-sync range, it also increases jitter at the sample point. Start with SJW = 1 and only increase if you see sync errors.
          - listitem [ref=e364]:
            - strong [ref=e365]: Forgetting temperature drift.
            - text: Ceramic resonators can shift ±0.5% across automotive temperature ranges (−40 °C to +125 °C). Always verify bit-timing parameters at both extremes, not just room temperature.
