      - main [ref=e111]:
        - heading "CAN Bit Timing" [level=1] [ref=e112]
        - paragraph [ref=e113]:
          - text: Every node on a CAN bus must agree on exactly when each bit begins and ends. Unlike SPI or I²C, CAN has
          - strong [ref=e114]: no dedicated clock wire
          - text: "— instead, each node derives bit boundaries from the bus signal itself using a configurable set of timing parameters. Getting these parameters right is essential: a mismatch of even a fraction of a percent can cause intermittent CRC errors under temperature drift."
        - heading "The time quantum (Tq)Permalink for this section" [level=2] [ref=e115]:
          - text: The time quantum (Tq)
          - link "Permalink for this section" [ref=e116] [cursor=pointer]:
            - /url: "#the-time-quantum-tq"
            - text: "#"
        - paragraph [ref=e117]:
          - text: The CAN controller’s oscillator clock is divided by the
          - strong [ref=e118]: Baud Rate Prescaler (BRP)
          - text: to produce a smaller unit called the
          - strong [ref=e119]: time quantum (Tq)
          - text: ":"
        - code [ref=e122]:
          - generic [ref=e123]: Tq = BRP / f_osc
        - paragraph [ref=e124]: For example, a 16 MHz oscillator with BRP = 2 yields Tq = 125 ns.
        - paragraph [ref=e125]: Every bit period is composed of a whole number of time quanta. By adjusting BRP and the segment lengths below, you control both the bit rate and the sample point.
        - heading "Anatomy of a single bitPermalink for this section" [level=2] [ref=e126]:
          - text: Anatomy of a single bit
          - link "Permalink for this section" [ref=e127] [cursor=pointer]:
            - /url: "#anatomy-of-a-single-bit"
            - text: "#"
        - paragraph [ref=e128]: "A CAN bit is divided into four logical segments, though most controllers merge the first two:"
        - code [ref=e131]:
          - generic [ref=e132]: ┌──────────┬────────────────────────────┬─────────────────┐
          - generic [ref=e133]: │ Sync Seg │ TSEG1 │ TSEG2 │
          - generic [ref=e134]: │ (1 Tq) │ (Prop Seg + Phase Seg 1) │ (Phase Seg 2) │
          - generic [ref=e135]: └──────────┴────────────────────────────┴─────────────────┘
          - generic [ref=e136]: ↑ ↑
          - generic [ref=e137]: bit start sample point
        - table [ref=e138]:
          - rowgroup [ref=e139]:
            - row "Segment Length Purpose" [ref=e140]:
              - columnheader "Segment" [ref=e141]
              - columnheader "Length" [ref=e142]
              - columnheader "Purpose" [ref=e143]
          - rowgroup [ref=e144]:
            - row "Sync Seg Always 1 Tq Hard-sync edge expected here; transitions that arrive during Sync Seg need no correction" [ref=e145]:
              - cell "Sync Seg" [ref=e146]:
                - strong [ref=e147]: Sync Seg
              - cell "Always 1 Tq" [ref=e148]
              - cell "Hard-sync edge expected here; transitions that arrive during Sync Seg need no correction" [ref=e149]
            - row "TSEG1 1 – 256 Tq (controller-dependent) Propagation delay compensation + phase error buffer before sampling. Combines Prop Seg + Phase Seg 1 in most register maps" [ref=e150]:
              - cell "TSEG1" [ref=e151]:
                - strong [ref=e152]: TSEG1
              - cell "1 – 256 Tq (controller-dependent)" [ref=e153]
              - cell "Propagation delay compensation + phase error buffer before sampling. Combines Prop Seg + Phase Seg 1 in most register maps" [ref=e154]:
                - text: Propagation delay compensation + phase error buffer
                - emphasis [ref=e155]: before
                - text: sampling. Combines Prop Seg + Phase Seg 1 in most register maps
            - row "TSEG2 1 – 128 Tq Phase error buffer after the sample point. Must be at least as large as the Information Processing Time (IPT, usually 1 – 2 Tq)" [ref=e156]:
              - cell "TSEG2" [ref=e157]:
                - strong [ref=e158]: TSEG2
              - cell "1 – 128 Tq" [ref=e159]
              - cell "Phase error buffer after the sample point. Must be at least as large as the Information Processing Time (IPT, usually 1 – 2 Tq)" [ref=e160]:
                - text: Phase error buffer
                - emphasis [ref=e161]: after
                - text: the sample point. Must be at least as large as the Information Processing Time (IPT, usually 1 – 2 Tq)
            - row "SJW 1 – min(4, TSEG2) Synchronization Jump Width. Maximum number of Tq the controller may shorten or lengthen a bit to re-sync" [ref=e162]:
              - cell "SJW" [ref=e163]:
                - strong [ref=e164]: SJW
              - cell "1 – min(4, TSEG2)" [ref=e165]
              - cell "Synchronization Jump Width. Maximum number of Tq the controller may shorten or lengthen a bit to re-sync" [ref=e166]
        - paragraph [ref=e167]:
          - strong [ref=e168]: Total bit time
          - text: = 1 + TSEG1 + TSEG2 time quanta.
        - paragraph [ref=e169]:
          - strong [ref=e170]: Bit rate
          - text: = f_osc / (BRP × (1 + TSEG1 + TSEG2)).
        - heading "Sample pointPermalink for this section" [level=2] [ref=e171]:
          - text: Sample point
          - link "Permalink for this section" [ref=e172] [cursor=pointer]:
            - /url: "#sample-point"
            - text: "#"
        - paragraph [ref=e173]:
          - text: The
          - strong [ref=e174]: sample point
          - text: "is where the controller reads the bus level and decides whether the bit is dominant or recessive. It falls at the boundary between TSEG1 and TSEG2:"
        - code [ref=e177]:
          - generic [ref=e178]: Sample Point (%) = (1 + TSEG1) / (1 + TSEG1 + TSEG2) × 100
        - heading "Recommended valuesPermalink for this section" [level=3] [ref=e179]:
          - text: Recommended values
          - link "Permalink for this section" [ref=e180] [cursor=pointer]:
            - /url: "#recommended-values"
            - text: "#"
